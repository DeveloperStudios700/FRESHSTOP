<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Office Screen Control Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Firebase v10 (MODULAR SDK) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBBrYnvC9jC4ZiB7c56V-OylqcENkUbgWs",
      authDomain: "realtime-database-394c2.firebaseapp.com",
      databaseURL: "https://realtime-database-394c2-default-rtdb.firebaseio.com",
      projectId: "realtime-database-394c2",
      storageBucket: "realtime-database-394c2.firebasestorage.app",
      messagingSenderId: "430494425329",
      appId: "1:430494425329:web:49b6a34269f0010eda8950",
      measurementId: "G-FXN6271HHL"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const statusText = document.getElementById("status");
    const toggleBtn = document.getElementById("toggleBtn");

    let currentState = true;

    const enabledRef = ref(db, "OfficeScreens/enabled");

    // 🔄 LIVE LISTENER
    onValue(enabledRef, (snapshot) => {
      currentState = snapshot.val();

      if (currentState) {
        statusText.innerText = "🟢 ENABLED";
        toggleBtn.className = "btn on";
        toggleBtn.innerText = "Disable Screens";
      } else {
        statusText.innerText = "🔴 DISABLED";
        toggleBtn.className = "btn off";
        toggleBtn.innerText = "Enable Screens";
      }
    });

    // 🔘 TOGGLE BUTTON
    window.toggleScreens = function () {
      set(enabledRef, !currentState);
    };
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f172a, #020617);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      padding: 40px;
      border-radius: 20px;
      width: 320px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-5px);
    }

    h1 {
      margin-bottom: 10px;
      font-size: 24px;
    }

    #status {
      margin: 20px 0;
      font-size: 18px;
      font-weight: bold;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
      width: 100%;
    }

    .on {
      background: #22c55e;
      color: black;
    }

    .on:hover {
      background: #16a34a;
    }

    .off {
      background: #ef4444;
      color: white;
    }

    .off:hover {
      background: #dc2626;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>🎮 Office Screens</h1>
  <div id="status">Loading...</div>
  <button id="toggleBtn" class="btn" onclick="toggleScreens()">Toggle</button>
</div>

</body>
</html>
