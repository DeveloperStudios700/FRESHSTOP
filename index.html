<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Screen Control Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBBrYnvC9jC4ZiB7c56V-OylqcENkUbgWs",
      authDomain: "realtime-database-394c2.firebaseapp.com",
      databaseURL: "https://realtime-database-394c2-default-rtdb.firebaseio.com",
      projectId: "realtime-database-394c2",
      storageBucket: "realtime-database-394c2.firebasestorage.app",
      messagingSenderId: "430494425329",
      appId: "1:430494425329:web:49b6a34269f0010eda8950"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const screens = ["Screen1", "Screen2", "Screen3"];

    window.onload = () => {
      screens.forEach((screen) => {
        const status = document.getElementById(screen + "_status");
        const btn = document.getElementById(screen + "_btn");

        const screenRef = ref(db, "OfficeScreens/" + screen);

        let current = true;

        onValue(screenRef, (snap) => {
          current = snap.val();

          if (current) {
            status.innerText = "🟢 ENABLED";
            btn.className = "btn on";
            btn.innerText = "Disable";
          } else {
            status.innerText = "🔴 DISABLED";
            btn.className = "btn off";
            btn.innerText = "Enable";
          }
        });

        btn.onclick = () => {
          set(screenRef, !current);
        };
      });
    };
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #020617, #0f172a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .card {
      background: #1e293b;
      padding: 30px;
      border-radius: 16px;
      width: 320px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .screen {
      margin-bottom: 20px;
      text-align: center;
    }

    .btn {
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
      margin-top: 5px;
    }

    .on {
      background: #22c55e;
      color: black;
    }

    .off {
      background: #ef4444;
      color: white;
    }
  </style>
</head>

<body>

<div class="card">
  <h1>🎮 Screen Control</h1>

  <div class="screen">
    <h3>Screen 1</h3>
    <p id="Screen1_status">Loading...</p>
    <button id="Screen1_btn" class="btn">Toggle</button>
  </div>

  <div class="screen">
    <h3>Screen 2</h3>
    <p id="Screen2_status">Loading...</p>
    <button id="Screen2_btn" class="btn">Toggle</button>
  </div>

  <div class="screen">
    <h3>Screen 3</h3>
    <p id="Screen3_status">Loading...</p>
    <button id="Screen3_btn" class="btn">Toggle</button>
  </div>

</div>

</body>
</html>
